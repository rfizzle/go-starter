name: Feature request
description: Propose a change to the Go Starter template.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Go Starter is a starter template. Proposals that add functionality,
        abstraction, or configuration without a concrete current need are
        usually declined; see the scope rules in
        [AGENTS.md](https://github.com/rfizzle/go-starter/blob/master/AGENTS.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete problem does a cloner of this template hit today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should the template do instead? Name the files or packages involved.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable behavior that would show the change is complete.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing targets, configuration, or patterns that partly solve this, and why they fall short.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a duplicate.
          required: true
