name: CI
on:
  pull_request:
  push:
    branches:
      - master
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `make secrets-check` scans commits, so a shallow clone would only
          # ever inspect the tip and silently pass.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install pinned development tools
        run: |
          echo "${RUNNER_TEMP}/go-tools" >> "${GITHUB_PATH}"
          make tools TOOL_BIN="${RUNNER_TEMP}/go-tools"
      - name: Check
        run: make check
      - name: Scan for committed secrets
        run: make secrets-check
      - name: Scan for known vulnerabilities
        run: make vuln
      - name: Test with race detector
        run: make race
      - name: Start the Podman API socket
        # testcontainers speaks the Docker-compatible API, which rootless
        # Podman serves once its user socket is running. Ryuk (the
        # testcontainers reaper) needs the privileged flag under rootless
        # Podman.
        run: |
          systemctl --user enable --now podman.socket
          echo "DOCKER_HOST=unix://$(podman info --format '{{.Host.RemoteSocket.Path}}')" >> "${GITHUB_ENV}"
          echo "TESTCONTAINERS_RYUK_CONTAINER_PRIVILEGED=true" >> "${GITHUB_ENV}"
      - name: Coverage
        env:
          GOSTARTER_REQUIRE_CONTAINERS: "1"
        run: make cover
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage.out
            coverage.maintained.out
          if-no-files-found: warn
      - name: Build
        run: make build
      - name: Check container configuration
        run: make container-check
      - name: Build container image
        # `container-check` only validates the GoReleaser packaging
        # configuration. This real single-architecture Podman build is what
        # proves the Dockerfile against the tree — for example a COPY that
        # references a directory the tree no longer has.
        env:
          CONTAINER_PLATFORMS: linux/amd64
        run: make container
      - name: Build release snapshot
        run: make release-snapshot

  cross-build:
    # GoReleaser ships darwin and windows binaries, but every other gate runs
    # on Linux. Compiling on the real runners catches a build-tag or
    # syscall-level break before a tag push turns it into a broken release.
    # Tests stay Linux-only: they need Podman for the integration tier.
    name: Cross-platform build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Build all packages
        # Not `make build`: make is not part of the default windows-latest
        # image, and this job only needs to prove the tree compiles.
        run: go build ./...
