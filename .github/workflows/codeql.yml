name: CodeQL
on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    # The schedule matters even when the code is unchanged: CodeQL ships new
    # queries, and a rerun applies them to the existing tree.
    - cron: "47 4 * * 1"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The analyze step reads the workflow run to derive the analysis key it
      # attaches to the uploaded SARIF; without actions:read that lookup fails
      # and the job ends in a configuration error.
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Go
        # CodeQL's autobuild would pick its own toolchain; pinning to go.mod
        # keeps the analyzed build identical to the one ci.yml validates.
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: go
          build-mode: autobuild
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:go
