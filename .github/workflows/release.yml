name: Release
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # attestations/id-token back the build-provenance steps below; both are
      # required for Sigstore keyless signing through GitHub's attestation API.
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          source scripts/version.bash
          if ! is_release_tag "${RELEASE_TAG}"; then
            echo "::error::${RELEASE_TAG} is not a valid v-prefixed semantic version"
            exit 1
          fi
          if [[ -z "$(git tag --points-at HEAD --list "${RELEASE_TAG}")" ]]; then
            echo "::error::${RELEASE_TAG} does not point at the checked-out commit"
            exit 1
          fi
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install pinned development tools
        run: |
          echo "${RUNNER_TEMP}/go-tools" >> "${GITHUB_PATH}"
          make tools TOOL_BIN="${RUNNER_TEMP}/go-tools"
      - name: Check
        # A tag push does not trigger ci.yml, so the release job runs the same
        # read-only gates itself. Without this a tag publishes binaries and
        # images that no workflow run ever validated.
        run: make ci
      - name: Check GoReleaser configuration
        run: goreleaser check
      - name: Log in to the GitHub container registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${REGISTRY_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean
      - name: Attest released archive provenance
        # subject-checksums attests every entry in the checksum manifest, so
        # the archives and their SBOMs are all covered by one statement.
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: dist/checksums.txt
      - name: Read published image digest
        id: image
        shell: bash
        # GoReleaser writes dist/digests.txt after pushing the image. Every
        # tag of one build shares the multi-platform index digest, so the
        # distinct set must be a single value.
        run: |
          if [[ ! -s dist/digests.txt ]]; then
            echo "::error::dist/digests.txt is missing or empty; cannot attest the image"
            exit 1
          fi
          mapfile -t digests < <(awk '{ print $1 }' dist/digests.txt | sort -u)
          if ((${#digests[@]} != 1)); then
            echo "::error::expected one image digest, found ${#digests[@]}: ${digests[*]}"
            exit 1
          fi
          echo "digest=sha256:${digests[0]}" >> "${GITHUB_OUTPUT}"
      - name: Attest published image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/rfizzle/go-starter
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
