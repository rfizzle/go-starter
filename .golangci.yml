version: "2"
run:
  concurrency: 4
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - gocritic
    - gosec
    - govet
    - staticcheck
    - unused
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - bin/
      - build/
      - docs/
      - scripts/
      - tmp/
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - bin/
      - build/
      - docs/
      - scripts/
      - tmp/
      - third_party$
      - builtin$
      - examples$
