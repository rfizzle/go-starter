openapi: 3.1.0
servers:
  - url: /api/v1
info:
  version: "0.0.1"
  title: Go Starter Project
tags:
  - name: system
    description: System component endpoints
paths:
  /healthz/liveness:
    get:
      operationId: HealthLiveness
      responses:
        "200":
          description: success
      security:
        - {}
      description: Liveness probe
      tags:
        - health
      summary: Liveness probe for kubernetes health check. Returns 200 if the service is alive.
  /healthz/readiness:
    get:
      tags:
        - health
      summary: Readiness probe
      operationId: HealthReadiness
      responses:
        "503":
          description: Not available
        "200":
          description: success
      security:
        - {}
      description: "Readiness probe for kubernetes health check. Returns 200 if the service is ready to serve requests. \nReturns 503 if the service is not ready to serve requests (starting up or shutting down).\n"
  /me:
    get:
      tags:
        - user
      summary: Return the authenticated subject
      operationId: GetCurrentUser
      description: "Example protected endpoint. Requires a valid bearer token and returns the subject encoded in it."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/currentUserResponse"
        "401":
          description: unauthorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT bearer token passed in the Authorization header.
  schemas:
    currentUserResponse:
      type: object
      required:
        - subject
      properties:
        subject:
          type: string
        # The fields below are populated when the subject resolves to a user
        # record in the database (the internal/modules/user business module). They are
        # absent when no matching user exists, so the endpoint still works
        # before any users are seeded.
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
    genericResponse:
      type: object
      properties:
        code:
          type: integer
          maximum: !!float 599
          minimum: !!float 100
        data:
          type: object
        message:
          type: string
        status:
          enum:
            - success
            - fail
            - error
          type: string
    errorResponse:
      type: object
      required:
        - status
        - message
      properties:
        code:
          type: integer
          maximum: !!float 599
          minimum: !!float 100
        data:
          type: object
        message:
          type: string
        status:
          enum:
            - error
          type: string
    failureResponse:
      type: object
      required:
        - status
        - data
      properties:
        data:
          type: object
        status:
          type: string
          enum:
            - fail
    successResponse:
      type: object
      required:
        - status
        - data
      properties:
        data:
          type: object
        status:
          type: string
          enum:
            - success
  requestBodies:
  responses:
    Success:
      description: Success
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/successResponse"
    # These two error responses have the same schema
    Failure:
      description: Failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/failureResponse"
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorResponse"
