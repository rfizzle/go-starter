# GoReleaser owns every tagged-release artifact. Local snapshots exercise the
# same archive, checksum, SBOM, and image definitions without publishing.
version: 2

project_name: starter

builds:
  - id: starter
    binary: starter
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -mod=vendor
      # Parity with build/docker/Dockerfile: a released binary and a locally
      # built image embed the same machine-independent paths.
      - -trimpath
    ldflags:
      - -s -w
      - -X {{.ModulePath}}/cmd.ApplicationName=starter
      - -X {{.ModulePath}}/cmd.BuildBranch={{.Branch}}
      - -X {{.ModulePath}}/cmd.BuildRevision={{.FullCommit}}
      - -X {{.ModulePath}}/cmd.BuildVersion={{.Version}}
      - -X {{.ModulePath}}/cmd.BuildEnv=production
      - -X {{.ModulePath}}/cmd.BuildDate={{.CommitTimestamp}}

archives:
  - id: starter
    ids:
      - starter
    formats:
      - zip
    name_template: >-
      {{ .ProjectName }}-{{ .Version }}-{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

sboms:
  - id: archive
    artifacts: archive

# dockers_v2 drives Docker Buildx directly and has no Podman backend, so
# release image packaging is the repository's one retained Docker dependency.
# Every developer-facing container workflow uses Podman; on a Podman-only host
# build the non-image artifacts with `--skip=docker`.
dockers_v2:
  - id: starter
    ids:
      - starter
    dockerfile: build/docker/Dockerfile.release
    images:
      - ghcr.io/rfizzle/go-starter
    tags:
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.description: OpenAPI-first foundation for PostgreSQL-backed Go services
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.title: starter
      org.opencontainers.image.version: "{{ .Version }}"
    sbom: true

snapshot:
  version_template: "{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^Merge "
